<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بُنيان | متابعة المشاريع العقارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbf9f5;--paper:#ffffff;--ink:#33414d;--muted:#7d8792;--line:#ece6dc;--accent:#ec7d32;--accent-dark:#b85a1b;--accent-soft:#fff1e6;--blue:#3a7cb0;--blue-soft:#eaf3fb;--ok:#2f9a62;--ok-soft:#eaf7f0;--late:#d2493d;--late-soft:#fdeeec;--head:#fff4ea;--grid:rgba(236,125,50,.05);--shadow:0 1px 2px rgba(51,65,77,.04),0 6px 18px rgba(51,65,77,.05)}
:root{--accent-dark:#b85a1b;--stripe:#ffd9bd;--accent2:#f5a66a;--head:#fff4ea}
html[data-theme=orange]{--accent:#ec7d32;--accent-dark:#b85a1b;--accent-soft:#fff1e6;--head:#fff4ea;--stripe:#ffd9bd;--accent2:#f5a66a;--bg:#fbf9f5;--grid:rgba(236,125,50,.05)}
html[data-theme=sky]{--accent:#2f80c8;--accent-dark:#1d5f99;--accent-soft:#eaf4fd;--head:#f0f7fe;--stripe:#c5e0f7;--accent2:#6db3ea;--bg:#f7fafd;--grid:rgba(47,128,200,.05)}
html[data-theme=teal]{--accent:#1f9e9a;--accent-dark:#13716e;--accent-soft:#e5f6f5;--head:#effaf9;--stripe:#bfe7e5;--accent2:#5ec8c3;--bg:#f6fbfb;--grid:rgba(31,158,154,.05)}
html[data-theme=green]{--accent:#3a9a6a;--accent-dark:#24724c;--accent-soft:#e8f6ef;--head:#f0f9f4;--stripe:#c4e8d4;--accent2:#74c69d;--bg:#f7fbf8;--grid:rgba(58,154,106,.05)}
html[data-theme=purple]{--accent:#7b5cc4;--accent-dark:#563c9a;--accent-soft:#f2eefc;--head:#f6f3fd;--stripe:#dacff5;--accent2:#a68fe0;--bg:#faf9fd;--grid:rgba(123,92,196,.05)}
html[data-theme=rose]{--accent:#d4567a;--accent-dark:#a33558;--accent-soft:#fdeef3;--head:#fef4f7;--stripe:#f6cada;--accent2:#e98aa6;--bg:#fdf9fa;--grid:rgba(212,86,122,.05)}
html[data-theme=gold]{--accent:#c39424;--accent-dark:#8f6a12;--accent-soft:#fbf4e2;--head:#fdf8ec;--stripe:#f0dfae;--accent2:#e0bd5f;--bg:#fcfaf4;--grid:rgba(195,148,36,.05)}
html[data-theme=slate]{--accent:#5b7083;--accent-dark:#3d4f60;--accent-soft:#eef2f6;--head:#f3f6f9;--stripe:#d3dde6;--accent2:#8fa3b5;--bg:#f8f9fb;--grid:rgba(91,112,131,.05)}
html[data-style=sharp] *{border-radius:3px!important}
html[data-style=sharp] .tick,html[data-style=sharp] .pill,html[data-style=sharp] .pbar,html[data-style=sharp] .pbar>div,html[data-style=sharp] .sw{border-radius:999px!important}
html[data-style=sharp] body{background-image:none}
html[data-style=sharp] .card,html[data-style=sharp] .stat,html[data-style=sharp] .phead,html[data-style=sharp] .sbody,html[data-style=sharp] .lcard,html[data-style=sharp] .tbl{box-shadow:none;border-color:#d9d3c8}
html[data-style=sharp] .card{border-top:3px solid var(--accent)}
html[data-style=bold] .top{background:var(--accent)}
html[data-style=bold] .top::after{background:var(--accent-dark)}
html[data-style=bold] .brand b,html[data-style=bold] .brand small{color:#fff}
html[data-style=bold] .logo{background:#fff;border-color:#fff}
html[data-style=bold] body{background-image:none;background-color:var(--head)}
html[data-style=bold] .card,html[data-style=bold] .stat,html[data-style=bold] .phead,html[data-style=bold] .lcard{box-shadow:0 10px 30px rgba(40,50,60,.10);border-color:transparent}
html[data-style=bold] .phead{border-top:5px solid var(--accent)}
html[data-style=bold] h1{color:var(--accent-dark)}
#syncBtn[data-st=err]{border-color:var(--late);background:var(--late-soft)}
#syncBtn[data-st=off]{border-style:dashed}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert{padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid}
.alert.warn{background:#fff8e6;color:#9a6a00;border-color:#f3d98b}.alert.over{background:var(--late-soft);color:var(--late);border-color:#f3b8b2}
.pill.warn{background:#fff8e6;color:#9a6a00}
.sh{margin:6px 0 -4px;font-size:14px;padding-top:10px;border-top:1px dashed var(--line)}.sh:first-child{border:0;padding-top:0}
.repc{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.repc small{color:var(--muted);font-size:12px;margin-top:-6px}
#printArea{display:none}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff!important;background-image:none!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;color:#111;font-size:11px}
 .rph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:8px;margin-bottom:12px}
 .rph h1{font-size:20px;margin:0}.rph p{margin:2px 0 0;color:#666}.rpd{color:#666}
 .rp h2{font-size:14px;margin:16px 0 6px;color:var(--accent-dark)}
 .rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
 .rsum div{border:1px solid #ccc;border-radius:6px;padding:6px 8px}.rsum span{display:block;color:#666;font-size:10px}.rsum b{font-size:14px}
 .rmeta{color:#555;margin:4px 0}.rnote{margin:4px 0;color:#444}
 .ralert{background:#fdeeec;color:#b3261e;border:1px solid #f3b8b2;padding:5px 8px;border-radius:6px;margin:4px 0;font-weight:700}
 .rt{width:100%;min-width:0;border-collapse:collapse;font-size:10.5px;margin-top:6px}
 .rt th{background:#d9d9d9!important;color:#111;border:1px solid #888;padding:4px;white-space:normal;text-align:center}
 .rt td{border:1px solid #999;padding:3px 4px;text-align:center;white-space:normal}
 .rt td.tl{text-align:right}
 .rt tbody tr:nth-child(odd){background:#e2efda!important}
 .rt tfoot td{background:#e2efda!important;font-weight:800;font-size:12px}
 .rt .neg{color:#b3261e;font-weight:800}
 .rt thead{display:table-header-group}.rt tr{break-inside:avoid}
 .pb{break-before:page}
 .rpf{margin-top:14px;color:#777;font-size:10px;border-top:1px solid #ccc;padding-top:6px}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.ready{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;background:var(--bg);border-radius:12px;text-align:center}
.ready .ricon{font-size:44px}.ready b{word-break:break-word}.ready small{color:var(--muted)}
.bigb{justify-content:center;padding:13px;font-size:16px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;flex:none}
.thgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:12px;font-weight:700}
.thbtn.on{border-color:var(--ink)}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.6)}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stbtn{padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:center;font-weight:800;font-size:13px}
.stbtn small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.stbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.prev{height:34px;border-radius:6px;margin-bottom:6px;border:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden}
.prev i{position:absolute;inset:0 0 auto 0;height:9px;background:#fff;border-bottom:2px solid var(--accent)}
.prev b{position:absolute;right:6px;left:6px;bottom:5px;height:12px;background:#fff;border-radius:6px;border:1px solid var(--line)}
.prev.sharp b{border-radius:1px}.prev.sharp{background:#fff}
.prev.bold i{background:var(--accent);height:11px}.prev.bold b{box-shadow:0 3px 8px rgba(0,0,0,.12);border:0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,sans-serif;background-color:var(--bg);color:var(--ink);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px}.wrapf{flex-wrap:wrap}.grow{flex:1;min-width:0}.center{justify-content:center}.mb{margin-bottom:12px;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);box-shadow:var(--shadow)}
.top::after{content:"";display:block;height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--stripe) 12px 24px)}
.top .wrap{height:64px}
.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--stripe);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand b{display:block;font-size:21px;font-weight:800;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.btn{font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--paper);border-color:var(--line)}
.danger{color:var(--late)!important}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px}
body.is-admin #adminBtn{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent)}
body:not(.is-admin) .adm{display:none!important}
main{padding:22px 0 70px}
/* home */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:28px;margin:0 0 4px;font-weight:800;line-height:1.25}
.hero p{margin:0;color:var(--muted);max-width:560px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stat span{color:var(--muted);font-size:13px}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.stat.late b{color:var(--late)}.stat.ok b{color:var(--ok)}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:12px}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card-top{display:flex;gap:12px;align-items:center}
.card h3{margin:0;font-size:18px;font-weight:800}
.card small{color:var(--muted)}
.ticon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.t-build{background:var(--accent-soft)}.t-renov{background:var(--blue-soft)}.t-buy{background:var(--ok-soft)}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.pbar.big{height:14px;margin:4px 0 6px}
.pbar.thin{height:6px;margin-top:6px}
.pbar.thin>div{background:var(--blue)}
.pbar.over>div{background:var(--late)}
.pct{font-size:22px;font-weight:800}
.next{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.next span{font-size:12px;color:var(--muted)}
.okt{color:var(--ok)}
.money{font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.money span{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.late{background:var(--late-soft);color:var(--late)}.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.muted{background:var(--bg);color:var(--muted)}
.pill.build{background:var(--accent-soft);color:var(--accent)}.pill.renov{background:var(--blue-soft);color:var(--blue)}.pill.buy{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:2px dashed var(--line);border-radius:16px;background:var(--paper)}
.empty .row{margin-top:14px;flex-wrap:wrap}
/* project */
.crumbs{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.phead{display:flex;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.phead h1{margin-top:6px}
.ring{display:block}
.ring-bg{fill:none;stroke:var(--line);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{font-family:'Tajawal',sans-serif;font-weight:800;fill:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kpis div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.kpis span{display:block;font-size:12px;color:var(--muted)}
.kpis b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis small{font-size:12px;color:var(--muted)}
.late-t{color:var(--late);font-weight:700}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent-dark);box-shadow:inset 0 0 0 1px var(--stripe)}
/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.step{display:flex;gap:14px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;right:19px;top:42px;bottom:2px;width:3px;border-radius:3px;background:var(--line)}
.step.s-done:not(:last-child)::before{background:var(--ok)}
.tick{width:40px;height:40px;border-radius:50%;flex:none;border:3px solid var(--line);background:var(--paper);font-weight:800;font-size:15px;color:var(--muted);display:grid;place-items:center;z-index:1;cursor:pointer;transition:.15s}
.tick:disabled{cursor:default}
body.is-admin .tick:not(:disabled):hover{transform:scale(1.08);box-shadow:0 0 0 4px var(--accent-soft)}
.s-done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.s-current .tick{border-color:var(--accent);color:var(--accent)}
.s-late .tick{border-color:var(--late);color:var(--late)}
.sbody{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.s-current .sbody{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.s-late .sbody{border-color:var(--late)}
.sbody h4{margin:0;font-size:16px;font-weight:800}
.s-done .sbody h4{color:var(--muted)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.note{margin:8px 0 0;font-size:14px;background:var(--bg);padding:8px 10px;border-radius:8px}
.sact,.iact{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sact button,.iact button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:700}
.sact button:disabled{opacity:.35;cursor:default}
.iact{margin-top:0}
/* costs */
.addform{display:grid;grid-template-columns:2fr 1.1fr .8fr 1.1fr 1.1fr 1.2fr 1.3fr auto;gap:8px;align-items:end;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.live{font-size:14px;color:var(--muted);white-space:nowrap}
.live b{color:var(--ink)}
.items{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.items .empty{border:0;border-radius:0}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tag{background:var(--blue-soft);color:var(--blue);padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-left:6px}
.itot{white-space:nowrap}
.item.total{background:var(--head);color:var(--accent-dark);border:0;font-size:16px}
.sec{font-size:17px;margin:22px 0 10px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:18px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:18px}
.x{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted)}
.mcontent{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mcontent label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.mcontent label.check{flex-direction:row;align-items:flex-start;font-weight:500;gap:8px}
.mcontent label.check input{width:auto;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(51,65,77,.12);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
.lsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.lcard{text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:.15s}
.lcard span{color:var(--muted);font-size:13px;font-weight:700}.lcard b{font-size:18px}.lcard small{font-size:12px;color:var(--muted)}
.lcard.on{border:2px solid var(--accent);background:var(--accent-soft)}
.lcard.add{align-items:center;justify-content:center;border-style:dashed;font-weight:800;color:var(--accent);box-shadow:none}

   alu.entries.push(e);return false}
  for(const k in KW)if(KW[k].test(e.name)){g(k).entries.push(e);return false}
  return true});
 Object.values(p.ledgers).forEach(l=>l.entries.sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
 p.ledgers.sort((a,b)=>{const i=L5.indexOf(a.name),j=L5.indexOf(b.name);return(i<0?99:i)-(j<0?99:j)})}

 db.projects.forEach(p=>{if(!p.ledgers){p.ledgers=[{id:uid(),name:'المصروفات',total:+p.budget||0,note:'',entries:(p.items||[]).map(i=>({id:i.id||uid(),name:i.name,date:i.date||'',amount:(+i.qty||0)*(+i.price||0),start:'',end:'',note:'',by:i.by||''}))}]}delete p.items;delete p.budget;split5(p)})}

const FS={doing:['جاري التنفيذ','blue','⏳'],done:['تم التنفيذ','ok','✓'],late:['متأخر','late','⚠']};
const fsSel=(e,attrs)=>`<select class="inl fs fs-${e.status||'none'}" ${attrs}><option value="">— اختر —</option>${Object.entries(FS).map(([k,[l,,i]])=>`<option value="${k}" ${e.status===k?'selected':''}>${i} ${l}</option>`).join('')}</select>`;
const fsPill=e=>e.status&&FS[e.status]?`<span class="pill ${FS[e.status][1]}">${FS[e.status][2]} ${FS[e.status][0]}</span>`:'<span class="muted">—</span>';
const paid=l=>l.entries.reduce((a,e)=>a+(+e.amount||0),0);
const spent=p=>(p.ledgers||[]).reduce((a,l)=>a+paid(l),0);
const nextStep=p=>p.steps.find(s=>!s.done);
const lateCount=p=>p.steps.filter(s=>!s.done&&s.date&&s.date<today()).length;
const lastDoneIdx=p=>{let k=-1;p.steps.forEach((s,i)=>{if(s.done)k=i});return k};
function st(p,s){if(s.done)return'done';if(s.date&&s.date<today())return'late';return s===nextStep(p)?'current':'upcoming'}
const ST={done:['مكتملة','ok'],late:['متأخرة','late'],current:['جارية الآن','blue'],upcoming:['قادمة','muted']};
const stat=(l,v,c='')=>`<div class="stat ${c}"><span>${l}</span><b>${v}</b></div>`;
const rel=d=>{const x=diffDays(d,today());return x<0?`<span class="late-t">متأخرة ${-x} يوم</span>`:x===0?'موعدها اليوم':`بعد ${x} يوم`};

function ring(pct,size=128){const r=(size-14)/2,c=2*Math.PI*r,o=c*(1-pct/100),h=size/2;
 return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" class="ring-bg"/><circle cx="${h}" cy="${h}" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${h-2}" text-anchor="middle" dominant-baseline="middle" font-size="28">${pct}%</text><text x="${h}" y="${h+24}" text-anchor="middle" font-size="12" style="fill:var(--muted);font-weight:500">نسبة الإنجاز</text></svg>`}

function renderHome(){

 const tSp=all.reduce((a,p)=>a+spent(p),0),tL=all.reduce((a,p)=>a+lateCount(p),0);
 return `<section class="hero"><div><h1>مشاريعك العقارية</h1><p>تابع مراحل البناء والترميم وشراء وبيع العقارات، واحسب التكاليف، وراقب نسبة الإنجاز في مكان واحد.</p></div><button class="btn primary adm" data-act="newProject">＋ مشروع جديد</button></section>

 <section class="lhead"><div class="grow">${admin?`<input class="inl ttl" data-edit="ledger" data-id="${l.id}" data-f="name" value="${esc(l.name)}">`:`<h2>${esc(l.name)}</h2>`}</div><button class="btn ghost danger adm" data-act="delLedger" data-id="${l.id}">حذف القسم</button></section>

const GHK='bunyan_gh',BASEK=KEY+'_base';
let gh=(()=>{try{return JSON.parse(localStorage.getItem(GHK))||{}}catch(e){return{}}})();
if(!gh.owner&&GH_REPO.includes('/')){[gh.owner,gh.repo]=GH_REPO.split('/')}
var ghSha=null,dirty=(()=>{try{return localStorage.getItem(KEY+'_dirty')==='1'}catch(e){return false}})(),pushT=null,busy=false,syncReady=false,pendR=false;
const ghOn=()=>!!(gh.owner&&gh.repo&&gh.token);
const b64e=x=>btoa(unescape(encodeURIComponent(x))),b64d=x=>decodeURIComponent(escape(atob(x.replace(/\s/g,''))));
const ghUrl=()=>`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${(gh.path||'data.json').split('/').map(encodeURIComponent).join('/')}`;
const ghReq=(method,body)=>fetch(ghUrl()+(method==='GET'?`?ref=${encodeURIComponent(gh.branch||'main')}&_=${Date.now()}`:''),{method,cache:'no-store',headers:{Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
async function ghGet(){const r=await ghReq('GET');if(r.status===404)return{sha:null,data:null};if(!r.ok)throw r.status;const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))}}
const getBase=()=>{try{return JSON.parse(localStorage.getItem(BASEK))}catch(e){return null}};
const setBase=d=>{try{d?localStorage.setItem(BASEK,JSON.stringify(d)):localStorage.removeItem(BASEK)}catch(e){}};
const clean=()=>{dirty=false;try{localStorage.removeItem(KEY+'_dirty')}catch(e){}};
const keepLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
function setGh(st){const M={off:['☁️','المزامنة غير مفعّلة — اضغط لربط GitHub'],ok:['✅','محفوظ ومتزامن مع GitHub'],busy:['🔄','جارٍ الحفظ…'],err:['⚠️','تعذّر الاتصال بـ GitHub — التغييرات محفوظة على جهازك وستُرفع لاحقاً']};const b=$('#syncBtn');if(b){b.textContent=M[st][0];b.title=M[st][1];b.dataset.st=st}}
// دمج ثلاثي: يحافظ على تعديلات الطرفين
const isO=x=>x&&typeof x==='object'&&!Array.isArray(x),eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function m3(b,l,r){if(eq(l,b))return r;if(eq(r,b)||eq(l,r))return l;
 if(isO(l)&&isO(r)){const B=isO(b)?b:{},o={};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{const iL=k in l,iR=k in r,iB=k in B;
  if(iL&&iR)o[k]=m3(B[k],l[k],r[k]);else if(iL){if(!iB||!eq(l[k],B[k]))o[k]=l[k]}else if(!iB||!eq(r[k],B[k]))o[k]=r[k]});return o}
 if(Array.isArray(l)&&Array.isArray(r)){const B=Array.isArray(b)?b:[],ids=a=>a.every(x=>isO(x)&&x.id);
  if(ids(l)&&ids(r)){const bm=new Map(B.filter(isO).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),out=[];
   r.forEach(x=>{if(lm.has(x.id))out.push(m3(bm.get(x.id),lm.get(x.id),x));else if(!bm.has(x.id)||!eq(bm.get(x.id),x))out.push(x)});
   l.forEach((x,i)=>{if(!rm.has(x.id)&&!bm.has(x.id)){let pos=0;for(let j=i-1;j>=0;j--){const k=out.findIndex(y=>y.id===l[j].id);if(k>-1){pos=k+1;break}}out.splice(pos,0,x)}});return out}
  const u=l.filter(x=>!(B.some(y=>eq(y,x))&&!r.some(y=>eq(y,x))));r.forEach(x=>{if(!u.some(y=>eq(y,x))&&!B.some(y=>eq(y,x)))u.push(x)});return u}
 return l}
function adopt(data,sha){ghSha=sha;setBase(data);db=data;migrate();keepLocal()}
function safeRender(){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pendR=true;return}render()}
async function pull(notify){if(!ghOn()||busy)return;busy=true;
 try{const {sha,data}=await ghGet();busy=false;
  if(!data){syncReady=true;dirty=true;return push()}
  if(sha===ghSha){syncReady=true;setGh(dirty?'busy':'ok');if(dirty)schedulePush();return}
  const base=getBase(),before=JSON.stringify(db);
  if(dirty&&base){ghSha=sha;db=m3(base,db,data);setBase(data);migrate();keepLocal();schedulePush()}
  else{adopt(data,sha);clean();setGh('ok')}
  syncReady=true;if(JSON.stringify(db)!==before){safeRender();if(notify)toast('🔄 وصلت تحديثات جديدة')}}
 catch(e){busy=false;setGh('err');if(e===401||e===403||e===404)toast('تحقق من رمز GitHub وصلاحية الوصول للمستودع')}}
function schedulePush(){clearTimeout(pushT);setGh('busy');pushT=setTimeout(push,1200)}
async function push(){if(!ghOn())return;if(busy){schedulePush();return}busy=true;setGh('busy');
 try{for(let i=0;i<4;i++){const {sha,data}=await ghGet(),base=getBase();
   if(data&&!base){adopt(data,sha);clean();busy=false;setGh('ok');render();return}
   const out=data&&sha!==ghSha?m3(base,db,data):db;
   const r=await ghReq('PUT',{message:'تحديث من '+(who()||'مستخدم'),content:b64e(JSON.stringify(out,null,1)),branch:gh.branch||'main',...(sha?{sha}:{})});
   if(r.ok){const j=await r.json(),changed=!eq(out,db);ghSha=j.content.sha;setBase(out);db=out;keepLocal();clean();busy=false;setGh('ok');if(changed)safeRender();return}
   if(r.status!==409&&r.status!==422)throw r.status}
  throw 'conflict'}
 catch(e){busy=false;setGh('err');if(e===401||e===403||e===404)toast('تحقق من رمز GitHub وصلاحية الوصول للمستودع')}}

 imgs.forEach((im,i)=>{const pg=3+i*3,ct=pg+1,ig=pg+2,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  offs[pg]=len;put(`${pg} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</Im0 ${ig} 0 R>>>>/Contents ${ct} 0 R>>\nendobj\n`);
  offs[ct]=len;put(`${ct} 0 obj\n<</Length ${cs.length}>>\nstream\n${cs}\nendstream\nendobj\n`);
  offs[ig]=len;put(`${ig} 0 obj\n<</Type/XObject/Subtype/Image/Width ${im.w}/Height ${im.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${im.d.length}>>\nstream\n`);put(im.d);put('\nendstream\nendobj\n')});

  <h4 class="sh">⚙️ عام</h4>
  <label>العملة<input name="currency" value="${esc(db.settings.currency)}"></label>
  <label>الأشخاص الذين يقومون بالإضافة (اسم في كل سطر)<textarea name="people" rows="3">${esc(db.settings.people.join('\n'))}</textarea></label>
  <button type="button" class="btn" data-act="managePeople">👥 إدارة / حذف الأشخاص</button>
  <h4 class="sh">💳 قوائم المدفوعات الافتراضية</h4>
  <label>تُنشأ تلقائياً مع كل مشروع جديد (اسم في كل سطر)<textarea name="defl" rows="5">${esc(defL().join('\n'))}</textarea></label>
  <label class="check"><input type="checkbox" name="applyAll"> أضف القوائم الناقصة أيضاً إلى المشاريع الحالية</label>
  <h4 class="sh">🔔 تنبيه تجاوز المبلغ</h4>
  <label class="check"><input type="checkbox" name="alertOn" ${db.settings.alertOn===false?'':'checked'}> نبّهني عند اقتراب أي قائمة من مبلغها الإجمالي أو تجاوزه</label>
  <label>نسبة التنبيه المبكر (%)<input name="alertPct" type="number" min="1" max="100" value="${+db.settings.alertPct||90}"></label>
  <h4 class="sh">🔐 الأمان والتقارير</h4>
  <div class="tools"><button type="button" class="btn" data-act="changePass">🔑 تغيير كلمة المرور</button><button type="button" class="btn" data-act="reports">📄 التقارير</button></div>
  <h4 class="sh">💾 النسخ الاحتياطي</h4>
  <div class="tools"><button type="button" class="btn" data-act="exportData">⬇ تصدير نسخة احتياطية</button><label class="btn" style="flex-direction:row;font-weight:700">⬆ استيراد<input type="file" accept=".json,application/json" id="importFile" hidden></label><button type="button" class="btn danger" data-act="resetData">مسح كل البيانات</button></div>`,d=>{
  db.settings.currency=d.currency||'د.ب';
  db.settings.people=[...new Set(d.people.split('\n').map(x=>x.trim()).filter(Boolean))];
  if(!db.settings.people.includes(who()))setWho(db.settings.people[0]||'');
  const dl=[...new Set(d.defl.split('\n').map(x=>x.trim()).filter(Boolean))];db.settings.defLedgers=dl.length?dl:L5;
  if(d.applyAll)db.projects.forEach(p=>defL().forEach(n=>{if(!p.ledgers.some(l=>l.name===n))p.ledgers.push({id:uid(),name:n,total:0,note:'',entries:[]})}));
  db.settings.alertOn=!!d.alertOn;db.settings.alertPct=Math.min(100,Math.max(1,+d.alertPct||90));
  save();render();toast('تم حفظ الإعدادات')}),
 changePass:()=>modal('تغيير كلمة المرور',`
  ${db.settings.pin?'<label>كلمة المرور الحالية<input name="old" type="password" required></label>':''}
  <label>كلمة المرور الجديدة<input name="n1" type="password" required minlength="4"></label>
  <label>تأكيد كلمة المرور الجديدة<input name="n2" type="password" required minlength="4"></label>
  <p class="muted small" style="margin:0">كلمة المرور مشتركة لكل من يتحكم بالمنصة، وتتغير عندهم أيضاً بعد المزامنة.</p>`,d=>{
  if(db.settings.pin&&d.old!==db.settings.pin){toast('كلمة المرور الحالية غير صحيحة');return false}
  if(d.n1!==d.n2){toast('كلمتا المرور غير متطابقتين');return false}
  db.settings.pin=d.n1;save();toast('🔑 تم تغيير كلمة المرور')},'تغيير'),
 reports:()=>reportsModal(),
 repLedger:()=>{const p=repP(),l=p.ledgers.find(x=>x.id===$('#repL').value)||p.ledgers[0];buildPDF(ledgerDoc(p,l),`كشف ${l.name} - ${p.name}`)},
 repProject:()=>{const p=repP();buildPDF(projectDoc(p,$('#repAll').checked),`التقرير الشامل - ${p.name}`)},
 repLedgerP:()=>{const p=repP(),l=p.ledgers.find(x=>x.id===$('#repL').value)||p.ledgers[0];printHTML(`كشف ${l.name} — ${p.name}`,ledgerReport(p,l))},
 repProjectP:()=>{const p=repP();printHTML(`التقرير الشامل — ${p.name}`,projectReport(p,$('#repAll').checked))},
 saveFile:()=>{const f=readyFile;if(!f)return;if(isMob()&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:f.name}).catch(e=>{if(e&&e.name!=='AbortError')dlFile(f)})}else dlFile(f)},
 openFile:()=>{if(!readyFile)return;const u=URL.createObjectURL(readyFile);const w=window.open(u,'_blank');if(!w)location.href=u},
 repExcel:()=>excelExport(repP()),
 exportData:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='bunyan-backup-'+today()+'.json';a.click();toast('تم التصدير')},
 resetData:()=>{if(confirm('سيتم مسح كل المشاريع والبيانات. متأكد؟')){db={settings:{...db.settings},projects:[]};save();closeModal();go();render()}}
};
function move(id,dir){const p=cur(),i=p.steps.findIndex(s=>s.id===id),j=i+dir;if(j<0||j>=p.steps.length)return;[p.steps[i],p.steps[j]]=[p.steps[j],p.steps[i]];save();render()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.act==='open'&&e.target.closest('input,label,select'))return;if(el.tagName==='A')e.preventDefault();const f=actions[el.dataset.act];f&&f(el.dataset,el)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id==='mf'&&modalSubmit){if(modalSubmit(d)!==false)closeModal()}
 if(f.id==='entryForm'){if(needUser())return;const p=cur(),l=p.ledgers.find(x=>x.id===view.lid);l.entries.push({id:uid(),name:d.name.trim(),date:d.date,amount:+d.amount||0,start:d.start,end:d.end,status:d.status||'',note:d.note,by:who()});save();render();toast('تمت الإضافة');alertToast(l);setTimeout(()=>{const n=$('#entryForm input[name=name]');n&&n.focus()},30)}
 if(f.id==='itemForm'){if(needUser())return;cur().items.push({id:uid(),name:d.name,cat:d.cat,qty:+d.qty||0,price:+d.price||0,date:d.date||today(),by:who()});save();render();toast('تمت الإضافة');setTimeout(()=>{const n=$('#itemForm input[name=name]');n&&n.focus()},30)}});
document.addEventListener('input',e=>{const f=e.target.form;if(f&&f.id==='itemForm'){const t=$('#liveTotal');t&&(t.textContent=num((+f.qty.value||0)*(+f.price.value||0))+' '+db.settings.currency)}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.classList&&el.classList.contains('mv')){if(!admin||!el.value)return;const p=cur(),to=p.ledgers.find(x=>x.id===el.value);let e;for(const l of p.ledgers){const i=l.entries.findIndex(x=>x.id===el.dataset.id);if(i>-1){e=l.entries.splice(i,1)[0];break}}
  if(e&&to){to.entries.push(e);to.entries.sort((a,b)=>(a.date||'').localeCompare(b.date||''));e.editedBy=who();save();render();toast('نُقل إلى '+to.name)}return}
 if(el.id==='userSel'){if(el.value==='__add')return addPerson();if(el.value==='__manage'){renderUsers();return peopleModal()}setWho(el.value);save();toast('المستخدم الحالي: '+el.value);return}
 if(el.dataset&&el.dataset.edit){if(!admin)return;const p=el.dataset.edit==='project'&&el.dataset.id?db.projects.find(x=>x.id===el.dataset.id):cur();if(!p)return;const k=el.dataset.edit,f=el.dataset.f;
  let o=k==='project'?p:k==='step'?p.steps.find(x=>x.id===el.dataset.id):k==='ledger'?p.ledgers.find(x=>x.id===el.dataset.id):null;
  if(k==='entry')for(const l of p.ledgers){o=l.entries.find(x=>x.id===el.dataset.id);if(o)break}
  if(!o)return;
  let v=el.type==='number'?(el.value===''?'':+el.value||0):el.value;if(f==='title'||f==='name'){v=v.trim();if(!v)return render()}
  o[f]=v;o.editedBy=who();save();render();toast('تم حفظ التعديل');if(k==='ledger')alertToast(o);if(k==='entry'&&f==='amount')alertToast(p.ledgers.find(l=>l.entries.includes(o)));return}
 if(el.id!=='importFile')return;const file=e.target.files[0];if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.projects)throw 0;db=x;db.settings=db.settings||{currency:'د.ب',pin:''};db.settings.people=db.settings.people||['المالك'];migrate();save();closeModal();go();render();toast('تم الاستيراد')}catch(err){toast('ملف غير صالح')}};r.readAsText(file)});
window.addEventListener('hashchange',route);
route();
setGh(ghOn()?'busy':'off');if(ghOn())pull(false);
</script>
</body>
</html>
